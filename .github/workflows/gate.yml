# This file is a template. Copy it to <world>/.github/workflows/gate.yml.
# Do not enable it here: this repository has no .github/workflows/ on purpose,
# and the steps below expect the engine checked out beside this one.
#
# A gate for a repository that publishes packs and nothing else. It never looks
# at how this repository is laid out: it builds each `packs/<id>/` into the
# archive that will travel, checks that archive against the envelope a pack has
# to unpack to, and - only on a `pack/<id>/vX.Y.Z` tag - publishes it.
#
# The three steps are the three things that can be wrong with a pack:
#
#   build       the directory becomes `dist/<id>.zip` in a fixed shape
#   check_pack  the archive holds only what the envelope allows
#   publish     the tag's zip and descriptor go onto the release
#
# Both checks come from the engine at the tag named below, so a world cannot
# drift from the engine's idea of a valid pack without saying so out loud.

name: gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ["pack/*"]

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # The tag names the engine release whose tools judge this repository.
      # It is not the `engine` range in a manifest: that range is about the
      # Godot runtime (`>=4.7.0 <5.0.0`) and does not move with this line.
      ENGINE_REF: v0.7.5
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: world

      - name: Check out the engine at the declared tag
        uses: actions/checkout@v4
        with:
          repository: liberalluz/lethebar
          ref: ${{ env.ENGINE_REF }}
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        working-directory: world
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=0
          for dir in packs/*/; do
            python ../engine/infra/tool/release/pack.py build "$dir" --out dist
            built=$((built + 1))
          done
          test "$built" -gt 0

      - name: check_pack
        working-directory: world
        run: |
          set -euo pipefail
          shopt -s nullglob
          checked=0
          for archive in dist/*.zip; do
            python ../engine/infra/checks/check_pack.py "$archive"
            checked=$((checked + 1))
          done
          test "$checked" -gt 0

      - name: publish
        if: startsWith(github.ref, 'refs/tags/pack/')
        working-directory: world
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in dist/*.zip; do
            python ../engine/infra/tool/release/pack.py publish "$archive" \
              --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --apply
          done

      - name: Upload what was built
        uses: actions/upload-artifact@v4
        with:
          name: packs
          path: world/dist/*.zip
          if-no-files-found: error
