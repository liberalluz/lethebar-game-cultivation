# This file is a template. It was copied from the engine's
# `infra/ci/author-gate.yml`; this copy is the one that runs.
#
# A gate for a repository that publishes packs and nothing else. It never looks
# at how this repository is laid out: it builds each `packs/<id>/` into the
# archive that will travel, checks that archive against the envelope a pack has
# to unpack to, and - only on a `pack/<id>/vX.Y.Z` tag - publishes it.
#
# The three steps are the three things that can be wrong with a pack:
#
#   build       the directory becomes `dist/<id>.zip` in a fixed shape
#   check_pack  the archive holds only what the envelope allows
#   publish     the tag's zip and descriptor go onto the release
#
# On a pull request it also runs `check_commit_body.py`, which reads the commits
# the branch would add: a commit that does not say why it exists is a change
# nobody can review later.
#
# The tools live in `infra/`, next to the packs they check: the gate runs this
# checkout's copies, so the repository and its gate move together and nothing
# else has to be reachable at a pinned ref.

name: gate

on:
  pull_request:
    # A pull request that only touches prose or the scaffold cannot change a
    # pack, so it does not need the archive built. Tag pushes are deliberately
    # not filtered: a `pack/*` tag must publish even when its commit touched
    # nothing the filter would match.
    paths:
      - "packs/**"
      - "infra/**"
      - ".github/workflows/gate.yml"
  push:
    branches: [main]
    tags: ["pack/*"]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          # On a pull request, check the branch head rather than the synthetic
          # merge commit: the commit-body check reads `origin/<base>..HEAD`, and
          # a merge commit has no body of its own. Push events keep their ref.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # The commit-body check reads the branch's commits, so it needs the
          # history the default shallow clone leaves out.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: check_commit_body
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python infra/checks/check_commit_body.py

      - name: build
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=0
          for dir in packs/*/; do
            python infra/tool/release/pack.py build "$dir" --out dist
            built=$((built + 1))
          done
          test "$built" -gt 0

      - name: check_pack
        run: |
          set -euo pipefail
          shopt -s nullglob
          checked=0
          for archive in dist/*.zip; do
            python infra/checks/check_pack.py "$archive"
            checked=$((checked + 1))
          done
          test "$checked" -gt 0

      - name: publish
        if: startsWith(github.ref, 'refs/tags/pack/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for archive in dist/*.zip; do
            python infra/tool/release/pack.py publish "$archive" \
              --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --apply
          done

      - name: Upload what was built
        uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/*.zip
          if-no-files-found: error
